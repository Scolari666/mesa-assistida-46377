<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Material</title>
<style>
  :root{
    --bg:#F2EEE9;
    --panel:#FFFFFF;
    --ink:#231A18;
    --ink-soft:#6B5B57;
    --line:#E2D6CC;
    --olive:#D8000A;
    --olive-dark:#1C0606;
    --amber:#D6A93C;
    --amber-bg:#FBF0D8;
    --steel:#3E6270;
    --steel-bg:#E3EEF1;
    --red:#9A2E22;
    --red-bg:#F7E4E0;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'IBM Plex Sans',Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px);
    background-size: 100% 40px;
    background-attachment: local;
  }
  .stencil{
    font-family:'Oswald','Arial Narrow',sans-serif;
    text-transform:uppercase;
    letter-spacing:1px;
  }
  header{
    background:linear-gradient(135deg,var(--olive-dark),#4A0F0F);
    color:#F2E9DC;
    padding:18px 20px 16px;
    border-bottom:4px solid var(--amber);
    display:flex;
    align-items:center;
    gap:14px;
  }
  header .brasao{
    height:52px;
    width:52px;
    object-fit:contain;
    flex-shrink:0;
    display:none;
  }
  header .brasao.show{display:block;}
  header h1{
    margin:0;
    font-size:22px;
    font-weight:600;
  }
  header .sub{
    font-size:12.5px;
    color:#D9C9A6;
    margin-top:4px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:#7FBF6A;display:inline-block;}
  .dot.off{background:#999;}

  .wrap{max-width:1100px;margin:0 auto;padding:16px;}

  .stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-bottom:16px;
  }
  .stat{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:10px 12px;
  }
  .stat .n{font-size:22px;font-weight:700;}
  .stat .l{font-size:11.5px;color:var(--ink-soft);}
  .stat.total .n{color:var(--olive-dark);}
  .stat.disp .n{color:#2C6E3F;}
  .stat.caut .n{color:var(--amber);}
  .stat.fa .n{color:var(--red);}

  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:14px;
    align-items:center;
  }
  input[type=text], input[type=search], select, textarea, input[type=number], input[type=date]{
    font-family:inherit;
    font-size:13.5px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
    color:var(--ink);
  }
  .search{flex:1;min-width:160px;}
  .catfilter{min-width:140px;}
  .btn{
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    padding:9px 14px;
    border-radius:8px;
    border:1px solid var(--olive-dark);
    background:var(--olive);
    color:#fff;
    cursor:pointer;
    white-space:nowrap;
  }
  .btn:hover{background:var(--olive-dark);}
  .btn.secondary{
    background:#fff;
    color:var(--olive-dark);
    border:1px solid var(--line);
  }
  .btn.secondary:hover{border-color:var(--olive-dark);}
  .btn.danger{background:var(--red);border-color:#7c281e;}
  .btn.danger:hover{background:#7c281e;}
  .btn.small{padding:5px 9px;font-size:12px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
  .chip{
    font-size:12px;
    padding:5px 11px;
    border-radius:20px;
    border:1px solid var(--line);
    background:#fff;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .chip.active{background:var(--olive-dark);color:#fff;border-color:var(--olive-dark);}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:12px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .thumb{
    width:100%;
    height:130px;
    background:#E4E1D4;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#A6A38F;
    font-size:11px;
    overflow:hidden;
  }
  .thumb img{width:100%;height:100%;object-fit:cover;}
  .card-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1;}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;}
  .card-name{font-weight:600;font-size:14.5px;line-height:1.25;}
  .card-cat{font-size:11px;color:var(--ink-soft);}
  .badge{
    font-size:10.5px;
    font-weight:700;
    padding:3px 8px;
    border-radius:20px;
    white-space:nowrap;
    text-transform:uppercase;
    letter-spacing:.3px;
  }
  .badge.disponivel{background:#E1EFDD;color:#2C6E3F;}
  .badge.cautelado{background:var(--amber-bg);color:var(--amber);}
  .badge.fa{background:var(--red-bg);color:var(--red);}
  .qty{font-size:12px;color:var(--ink-soft);}
  .card-actions{display:flex;gap:6px;margin-top:auto;padding-top:6px;flex-wrap:wrap;}
  .status-select{font-size:12px;padding:5px 6px;flex:1;min-width:90px;}

  .empty{
    text-align:center;
    padding:50px 20px;
    color:var(--ink-soft);
    background:var(--panel);
    border:1px dashed var(--line);
    border-radius:var(--radius);
  }

  .overlay{
    position:fixed;inset:0;background:rgba(20,22,15,.55);
    display:flex;align-items:flex-start;justify-content:center;
    padding:24px 14px;overflow-y:auto;z-index:50;
  }
  .modal{
    background:#fff;border-radius:12px;max-width:480px;width:100%;
    padding:20px 20px 18px;margin-top:20px;
  }
  .modal h2{margin:0 0 14px;font-size:17px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;}
  .field input, .field select, .field textarea{width:100%;}
  .field textarea{resize:vertical;min-height:50px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
  .photo-row{display:flex;gap:10px;align-items:center;}
  .photo-preview{
    width:64px;height:64px;border-radius:8px;background:#EDEAE0;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    border:1px solid var(--line);flex-shrink:0;
  }
  .photo-preview img{width:100%;height:100%;object-fit:cover;}
  .newcat-row{display:flex;gap:6px;margin-top:6px;}
  .newcat-row input{flex:1;}

  .cautela-item-row{
    display:flex;align-items:center;gap:8px;
    padding:6px 4px;border-bottom:1px solid var(--line);font-size:13px;
  }
  .cautela-item-row:last-child{border-bottom:none;}
  .cautela-list{max-height:180px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:2px 8px;}

  .panel-cautelas .cautela-card{
    background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    padding:10px 12px;margin-bottom:8px;
  }
  .cautela-card .head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;}
  .cautela-card .resp{font-weight:600;font-size:13.5px;}
  .cautela-card .meta{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .cautela-card .itens{font-size:12.5px;margin-top:6px;color:var(--ink);}
  .cautela-card .foot{margin-top:8px;display:flex;justify-content:flex-end;gap:6px;}

  .tabs{display:flex;gap:6px;margin-bottom:14px;}
  .tab{
    padding:8px 14px;border-radius:8px;border:1px solid var(--line);
    background:#fff;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-soft);
  }
  .tab.active{background:var(--olive-dark);color:#fff;border-color:var(--olive-dark);}

  .toast{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    background:var(--olive-dark);color:#fff;padding:10px 18px;border-radius:8px;
    font-size:13px;z-index:100;opacity:0;transition:opacity .25s;pointer-events:none;
  }
  .toast.show{opacity:1;}
  .err{color:var(--red);font-size:12px;margin-top:3px;}
  .loading{padding:40px;text-align:center;color:var(--ink-soft);}
  @media(max-width:520px){
    .stats{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>

<header>
  <img class="brasao" id="brasaoImg" alt="Brasão CBMRS">
  <div>
    <h1 class="stencil">CBMRS &middot; Controle de Material</h1>
    <div class="sub"><span class="dot" id="connDot"></span><span id="connText">Carregando estoque salvo neste dispositivo…</span></div>
  </div>
</header>

<div class="wrap">
  <div id="root" class="loading">Carregando estoque…</div>
</div>

<div id="toast" class="toast"></div>

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  var MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

  function formatDiaMes(ts){
    var d = new Date(ts);
    return { dia: String(d.getDate()), mes: MESES[d.getMonth()], ano: d.getFullYear() };
  }
  function formatDataCurta(ts){
    if(!ts) return '';
    var d = new Date(ts);
    var dd = String(d.getDate()).padStart(2,'0');
    var mm = String(d.getMonth()+1).padStart(2,'0');
    return dd+'/'+mm+'/'+d.getFullYear();
  }
  function base64ToBytes(b64){
    var bin = atob(b64);
    var arr = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }
  function downloadBytes(bytes, filename, targetWin){
    var blob = new Blob([bytes], {type:'application/pdf'});
    var url = URL.createObjectURL(blob);

    if(targetWin && !targetWin.closed){
      try{ targetWin.location.href = url; }catch(e){}
    }

    try{
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }catch(e){}

    mostrarLinkPdf(url, filename);
  }

  function mostrarLinkPdf(url, filename){
    var old = document.getElementById('pdfOverlay');
    if(old) old.remove();
    var html = '<div class="overlay" id="pdfOverlay"><div class="modal">';
    html += '<h2>Documento pronto</h2>';
    html += '<p style="font-size:13px;color:var(--ink-soft);margin-top:-6px;">Se o download não abriu sozinho, toque no botão abaixo.</p>';
    html += '<div class="modal-actions" style="justify-content:center;">';
    html += '<a href="'+url+'" download="'+filename+'" target="_blank" rel="noopener" class="btn" style="text-decoration:none;">Abrir / salvar PDF</a>';
    html += '</div>';
    html += '<div class="modal-actions"><button class="btn secondary" id="pdfClose">Fechar</button></div>';
    html += '</div></div>';
    document.body.insertAdjacentHTML('beforeend', html);
    document.getElementById('pdfClose').addEventListener('click', function(){
      var ov = document.getElementById('pdfOverlay');
      if(ov) ov.remove();
    });
  }

  var CAUTELA_ROWS = [293.6,307.9,322.2,336.6,350.9,365.2,379.6,393.9,408.2,422.5,436.9,451.2,465.6];
  var PAGE_H = 841.89;

  async function gerarPDFCautela(ct, targetWin){
    if(typeof PDFLib === 'undefined'){
      if(targetWin && !targetWin.closed) targetWin.close();
      toast('Biblioteca de PDF não carregou. Verifique sua conexão e tente novamente.');
      return;
    }
    try{
      var itensDet = ct.itens.map(function(it){
        var i = state.itens.find(function(x){return x.id===it.itemId;});
        return { qtd: it.quantidade, nome: i ? i.nome : '(item removido)' };
      });
      var chunks = [];
      for(var i=0;i<itensDet.length;i+=12) chunks.push(itensDet.slice(i,i+12));
      if(chunks.length===0) chunks.push([]);

      var templateBytes = base64ToBytes(CAUTELA_TEMPLATE_B64);
      var outDoc = await PDFLib.PDFDocument.create();
      var font = await outDoc.embedFont(PDFLib.StandardFonts.Helvetica);

      for(var c=0;c<chunks.length;c++){
        var srcDoc = await PDFLib.PDFDocument.load(templateBytes);
        var pages = await outDoc.copyPages(srcDoc, [0]);
        var page = pages[0];
        outDoc.addPage(page);
        preencherPagina(page, font, ct, chunks[c]);
      }

      var pdfBytes = await outDoc.save();
      var nomeArq = 'cautela_' + ct.responsavel.replace(/\s+/g,'_').toLowerCase() + '.pdf';
      downloadBytes(pdfBytes, nomeArq, targetWin);
      toast('Documento gerado');
    }catch(e){
      console.error('Erro ao gerar PDF', e);
      if(targetWin && !targetWin.closed) targetWin.close();
      toast('Não foi possível gerar o documento.');
    }
  }

  function preencherPagina(page, font, ct, itensChunk){
    var black = PDFLib.rgb(0,0,0);
    var white = PDFLib.rgb(1,1,1);
    var sz = 9;

    function draw(text, x, bottomY, size){
      page.drawText(String(text||''), { x: x, y: PAGE_H - bottomY + 3, size: size||sz, font: font, color: black });
    }

    var dm = formatDiaMes(ct.criadoEm);
    page.drawRectangle({ x:402, y: PAGE_H-144.0+0.5, width: 513-402, height: (144.0-132.5)-1, color: white });
    draw('RS, ' + dm.dia + ' de ' + dm.mes + ' de ' + dm.ano, 403, 143.2, 9.5);

    draw(formatDataCurta(ct.criadoEm), 133, 218.2, 8.5);

    for(var r=0;r<CAUTELA_ROWS.length-1;r++){
      var top = CAUTELA_ROWS[r], bottom = CAUTELA_ROWS[r+1];
      page.drawRectangle({ x:79.6, y: PAGE_H-bottom+0.6, width: 517.6-79.6, height: (bottom-top)-1.2, color: white });
      var item = itensChunk[r];
      if(item){
        draw(item.qtd, 100, bottom, 9);
        var nomeTxt = item.nome.length>62 ? item.nome.slice(0,60)+'…' : item.nome;
        draw(nomeTxt, 183, bottom, 9);
      }
    }

    draw(ct.responsavel, 222, 510.8, 9);
    draw(ct.telefone, 222, 522.3, 9);
    draw(formatDataCurta(ct.criadoEm), 222, 533.8, 9);
    draw(ct.status==='devolvida' ? formatDataCurta(ct.devolvidoEm) : (ct.previsao||''), 222, 547.0, 9);

    draw(ct.entregaNome, 196, 669.2, 9);
    draw(ct.entregaGraduacao, 196, 680.7, 9);
    draw(ct.entregaIdFunc, 196, 692.2, 9);
  }

  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._h);
    t._h = setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }

  var STORAGE_PREFIX = 'cbmrs_controle_material_';

  function setConn(ok){
    var dot = document.getElementById('connDot');
    var txt = document.getElementById('connText');
    if(ok){
      dot.classList.remove('off');
      txt.textContent = 'Estoque salvo automaticamente neste dispositivo';
    } else {
      dot.classList.add('off');
      txt.textContent = 'Não foi possível salvar neste dispositivo — verifique o espaço de armazenamento do navegador';
    }
  }

  async function loadAll(){
    try{
      state.itens = safeGet('itens') || [];
      state.cautelas = safeGet('cautelas') || [];
      state.categorias = safeGet('categorias') || ['Geral'];
      state.loaded = true;
      setConn(true);
    }catch(e){
      console.error('Erro ao carregar', e);
      state.itens = []; state.cautelas = []; state.categorias = ['Geral'];
      state.loaded = true;
      state.connError = true;
      setConn(false);
    }
    render();
  }

  function safeGet(key){
    try{
      var raw = window.localStorage.getItem(STORAGE_PREFIX + key);
      return raw ? JSON.parse(raw) : null;
    }catch(e){
      return null;
    }
  }

  function safeSet(key, value){
    try{
      window.localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value));
      setConn(true);
      return true;
    }catch(e){
      setConn(false);
      return false;
    }
  }

  async function saveItens(){
    if(!safeSet('itens', state.itens)) toast('Não foi possível salvar. Tente novamente.');
  }
  async function saveCautelas(){
    if(!safeSet('cautelas', state.cautelas)) toast('Não foi possível salvar. Tente novamente.');
  }
  async function saveCategorias(){
    safeSet('categorias', state.categorias);
  }

  function statusLabel(s){
    if(s==='disponivel') return 'Disponível';
    if(s==='cautelado') return 'Cautelado';
    if(s==='fa') return 'F.A.';
    return s;
  }

  function contagens(){
    var d=0,c=0,f=0;
    state.itens.forEach(function(i){
      if(i.status==='disponivel') d += i.quantidade;
      else if(i.status==='cautelado') c += i.quantidade;
      else if(i.status==='fa') f += i.quantidade;
    });
    return {total: d+c+f, disponivel:d, cautelado:c, fa:f};
  }

  function itensFiltrados(){
    return state.itens.filter(function(i){
      var okCat = state.filtroCategoria==='todas' || i.categoria===state.filtroCategoria;
      var okBusca = !state.busca || i.nome.toLowerCase().indexOf(state.busca.toLowerCase())>-1;
      return okCat && okBusca;
    });
  }

  function esc(s){
    var d = document.createElement('div');
    d.textContent = s==null? '' : s;
    return d.innerHTML;
  }

  function render(){
    var root = document.getElementById('root');
    if(!state.loaded){ root.innerHTML = '<div class="loading">Carregando estoque…</div>'; return; }

    var c = contagens();
    var html = '';

    html += '<div class="stats">';
    html += '<div class="stat total"><div class="n">'+c.total+'</div><div class="l">Itens no total</div></div>';
    html += '<div class="stat disp"><div class="n">'+c.disponivel+'</div><div class="l">Disponível</div></div>';
    html += '<div class="stat caut"><div class="n">'+c.cautelado+'</div><div class="l">Cautelado</div></div>';
    html += '<div class="stat fa"><div class="n">'+c.fa+'</div><div class="l">F.A.</div></div>';
    html += '</div>';

    html += '<div class="tabs">';
    html += '<div class="tab '+(state.view==='estoque'?'active':'')+'" data-tab="estoque">Estoque</div>';
    html += '<div class="tab '+(state.view==='cautelas'?'active':'')+'" data-tab="cautelas">Cautelas ativas ('+state.cautelas.filter(function(x){return x.status==='ativa';}).length+')</div>';
    html += '</div>';

    if(state.view==='estoque'){
      html += renderEstoque();
    } else {
      html += renderCautelas();
    }

    root.innerHTML = html;
    bindEvents();
  }

  function renderEstoque(){
    var html = '';
    html += '<div class="toolbar">';
    html += '<input class="search" type="search" id="buscaInput" placeholder="Buscar item…" value="'+esc(state.busca)+'">';
    html += '<select class="catfilter" id="catFiltro">';
    html += '<option value="todas"'+(state.filtroCategoria==='todas'?' selected':'')+'>Todas categorias</option>';
    state.categorias.forEach(function(cat){
      html += '<option value="'+esc(cat)+'"'+(state.filtroCategoria===cat?' selected':'')+'>'+esc(cat)+'</option>';
    });
    html += '</select>';
    html += '<button class="btn secondary" id="btnNovaCautela">Nova cautela</button>';
    html += '<button class="btn" id="btnNovoItem">+ Novo item</button>';
    html += '</div>';

    var itens = itensFiltrados();
    if(itens.length===0){
      html += '<div class="empty">Nenhum item cadastrado ainda.<br>Use "+ Novo item" para começar a montar o estoque.</div>';
      return html;
    }

    html += '<div class="grid">';
    itens.forEach(function(item){
      html += '<div class="card" data-id="'+item.id+'">';
      html += '<div class="thumb">'+(item.foto ? '<img src="'+item.foto+'">' : 'Sem foto')+'</div>';
      html += '<div class="card-body">';
      html += '<div class="card-top"><div><div class="card-name">'+esc(item.nome)+'</div><div class="card-cat">'+esc(item.categoria)+'</div></div>';
      html += '<span class="badge '+item.status+'">'+statusLabel(item.status)+'</span></div>';
      html += '<div class="qty">Qtd: '+item.quantidade+(item.observacoes ? ' · '+esc(item.observacoes) : '')+'</div>';
      html += '<div class="card-actions">';
      html += '<select class="status-select" data-action="status" data-id="'+item.id+'">';
      ['disponivel','cautelado','fa'].forEach(function(s){
        html += '<option value="'+s+'"'+(item.status===s?' selected':'')+'>'+statusLabel(s)+'</option>';
      });
      html += '</select>';
      html += '<button class="btn secondary small" data-action="editar" data-id="'+item.id+'">Editar</button>';
      html += '<button class="btn danger small" data-action="excluir" data-id="'+item.id+'">Excluir</button>';
      html += '</div></div></div>';
    });
    html += '</div>';
    return html;
  }

  function renderCautelas(){
    var html = '<div class="toolbar"><button class="btn" id="btnNovaCautela2">+ Nova cautela</button></div>';
    var ativas = state.cautelas.filter(function(x){return x.status==='ativa';}).sort(function(a,b){return b.criadoEm - a.criadoEm;});
    var devolvidas = state.cautelas.filter(function(x){return x.status==='devolvida';}).sort(function(a,b){return b.criadoEm - a.criadoEm;});

    html += '<div class="panel-cautelas">';
    if(ativas.length===0){
      html += '<div class="empty">Nenhuma cautela ativa no momento.</div>';
    } else {
      ativas.forEach(function(ct){
        html += cautelaCardHtml(ct, true);
      });
    }

    if(devolvidas.length>0){
      html += '<h3 class="stencil" style="font-size:13px;color:var(--ink-soft);margin:18px 0 8px;">Histórico de devoluções</h3>';
      devolvidas.slice(0,15).forEach(function(ct){
        html += cautelaCardHtml(ct, false);
      });
    }
    html += '</div>';
    return html;
  }

  function cautelaCardHtml(ct, ativa){
    var nomesItens = ct.itens.map(function(it){
      var i = state.itens.find(function(x){return x.id===it.itemId;});
      return (i? i.nome : '(item removido)') + ' ×' + it.quantidade;
    }).join(', ');
    var html = '<div class="cautela-card">';
    html += '<div class="head"><div><div class="resp">'+esc(ct.responsavel)+(ct.setor? ' · '+esc(ct.setor):'')+'</div>';
    html += '<div class="meta">Cautelado em '+formatData(ct.criadoEm)+(ct.previsao? ' · devolução prevista '+esc(ct.previsao):'')+(ct.status==='devolvida'? ' · devolvido em '+formatData(ct.devolvidoEm):'')+'</div></div>';
    html += '<span class="badge '+(ativa?'cautelado':'disponivel')+'">'+(ativa?'Ativa':'Devolvida')+'</span></div>';
    html += '<div class="itens">'+esc(nomesItens)+'</div>';
    if(ct.observacao) html += '<div class="meta" style="margin-top:4px;">Obs: '+esc(ct.observacao)+'</div>';
    html += '<div class="foot">';
    html += '<button class="btn secondary small" data-action="gerarpdf" data-id="'+ct.id+'">Gerar documento</button>';
    if(ativa){
      html += '<button class="btn secondary small" data-action="devolver" data-id="'+ct.id+'">Registrar devolução</button>';
    }
    html += '</div>';
    html += '</div>';
    return html;
  }

  function formatData(ts){
    if(!ts) return '';
    var d = new Date(ts);
    return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }

  function bindEvents(){
    var busca = document.getElementById('buscaInput');
    if(busca) busca.addEventListener('input', function(e){ state.busca = e.target.value; render(); document.getElementById('buscaInput').focus(); document.getElementById('buscaInput').selectionStart = document.getElementById('buscaInput').selectionEnd = document.getElementById('buscaInput').value.length; });

    var catF = document.getElementById('catFiltro');
    if(catF) catF.addEventListener('change', function(e){ state.filtroCategoria = e.target.value; render(); });

    var btnNovo = document.getElementById('btnNovoItem');
    if(btnNovo) btnNovo.addEventListener('click', function(){ openItemModal(null); });

    var btnCaut = document.getElementById('btnNovaCautela');
    if(btnCaut) btnCaut.addEventListener('click', openCautelaModal);
    var btnCaut2 = document.getElementById('btnNovaCautela2');
    if(btnCaut2) btnCaut2.addEventListener('click', openCautelaModal);

    document.querySelectorAll('.tab').forEach(function(t){
      t.addEventListener('click', function(){ state.view = t.getAttribute('data-tab'); render(); });
    });

    document.querySelectorAll('[data-action="editar"]').forEach(function(b){
      b.addEventListener('click', function(){
        var item = state.itens.find(function(i){return i.id===b.getAttribute('data-id');});
        openItemModal(item);
      });
    });
    document.querySelectorAll('[data-action="excluir"]').forEach(function(b){
      b.addEventListener('click', function(){
        var id = b.getAttribute('data-id');
        var item = state.itens.find(function(i){return i.id===id;});
        if(!item) return;
        if(confirm('Excluir "'+item.nome+'" do estoque?')){
          state.itens = state.itens.filter(function(i){return i.id!==id;});
          saveItens();
          render();
          toast('Item excluído');
        }
      });
    });
    document.querySelectorAll('[data-action="status"]').forEach(function(sel){
      sel.addEventListener('change', function(){
        var id = sel.getAttribute('data-id');
        var item = state.itens.find(function(i){return i.id===id;});
        if(!item) return;
        item.status = sel.value;
        saveItens();
        render();
        toast(item.nome+' agora está '+statusLabel(item.status).toLowerCase());
      });
    });
    document.querySelectorAll('[data-action="devolver"]').forEach(function(b){
      b.addEventListener('click', function(){
        registrarDevolucao(b.getAttribute('data-id'));
      });
    });
    document.querySelectorAll('[data-action="gerarpdf"]').forEach(function(b){
      b.addEventListener('click', function(){
        var ct = state.cautelas.find(function(c){return c.id===b.getAttribute('data-id');});
        if(!ct) return;
        var win = null;
        try{ win = window.open('', '_blank'); }catch(e){ win = null; }
        gerarPDFCautela(ct, win);
      });
    });
  }

  function registrarDevolucao(cautelaId){
    var ct = state.cautelas.find(function(c){return c.id===cautelaId;});
    if(!ct) return;
    openDevolucaoModal(ct);
  }

  function openDevolucaoModal(ct){
    var html = '<div class="overlay" id="modalOverlay"><div class="modal">';
    html += '<h2>Devolver cautela — '+esc(ct.responsavel)+'</h2>';
    html += '<p style="font-size:13px;color:var(--ink-soft);margin-top:-6px;">Escolha o estado de cada item ao devolver.</p>';
    html += '<div class="cautela-list">';
    ct.itens.forEach(function(it){
      var i = state.itens.find(function(x){return x.id===it.itemId;});
      var nome = i? i.nome : '(item removido)';
      html += '<div class="cautela-item-row"><div style="flex:1;">'+esc(nome)+' ×'+it.quantidade+'</div>';
      html += '<select class="status-select" data-devitem="'+it.itemId+'" style="max-width:130px;">';
      html += '<option value="disponivel">Disponível</option>';
      html += '<option value="fa">F.A.</option>';
      html += '</select></div>';
    });
    html += '</div>';
    html += '<div class="modal-actions">';
    html += '<button class="btn secondary" id="modalCancel">Cancelar</button>';
    html += '<button class="btn" id="modalConfirmDev">Confirmar devolução</button>';
    html += '</div></div></div>';

    document.body.insertAdjacentHTML('beforeend', html);
    document.getElementById('modalCancel').addEventListener('click', closeModal);
    document.getElementById('modalOverlay').addEventListener('click', function(e){ if(e.target.id==='modalOverlay') closeModal(); });
    document.getElementById('modalConfirmDev').addEventListener('click', function(){
      ct.itens.forEach(function(it){
        var sel = document.querySelector('[data-devitem="'+it.itemId+'"]');
        var novoStatus = sel ? sel.value : 'disponivel';
        var item = state.itens.find(function(x){return x.id===it.itemId;});
        if(item) item.status = novoStatus;
      });
      ct.status = 'devolvida';
      ct.devolvidoEm = Date.now();
      saveItens();
      saveCautelas();
      closeModal();
      render();
      toast('Devolução registrada');
    });
  }

  function closeModal(){
    var ov = document.getElementById('modalOverlay');
    if(ov) ov.remove();
  }

  function openItemModal(item){
    var editando = !!item;
    var html = '<div class="overlay" id="modalOverlay"><div class="modal">';
    html += '<h2>'+(editando?'Editar item':'Novo item')+'</h2>';

    html += '<div class="field"><label>Nome do item</label><input type="text" id="fNome" value="'+(editando?esc(item.nome):'')+'" placeholder="Ex: Fuzil de instrução Mod. X"></div>';

    html += '<div class="field"><label>Categoria</label><select id="fCategoria">';
    state.categorias.forEach(function(cat){
      html += '<option value="'+esc(cat)+'"'+(editando && item.categoria===cat?' selected':'')+'>'+esc(cat)+'</option>';
    });
    html += '</select>';
    html += '<div class="newcat-row"><input type="text" id="fNovaCategoria" placeholder="Ou criar nova categoria"><button class="btn secondary small" id="btnAddCat" type="button">Adicionar</button></div></div>';

    html += '<div class="field"><label>Quantidade</label><input type="number" min="0" id="fQtd" value="'+(editando?item.quantidade:1)+'"></div>';

    html += '<div class="field"><label>Situação</label><select id="fStatus">';
    ['disponivel','cautelado','fa'].forEach(function(s){
      html += '<option value="'+s+'"'+(editando && item.status===s?' selected':(!editando && s==='disponivel'?' selected':''))+'>'+statusLabel(s)+'</option>';
    });
    html += '</select></div>';

    html += '<div class="field"><label>Foto</label><div class="photo-row"><div class="photo-preview" id="fotoPreview">'+(editando && item.foto? '<img src="'+item.foto+'">' : 'Sem foto')+'</div><input type="file" accept="image/*" id="fFoto"></div></div>';

    html += '<div class="field"><label>Observações (opcional)</label><textarea id="fObs">'+(editando?esc(item.observacoes||''):'')+'</textarea></div>';

    html += '<div id="fErr" class="err" style="display:none;"></div>';

    html += '<div class="modal-actions">';
    html += '<button class="btn secondary" id="modalCancel">Cancelar</button>';
    html += '<button class="btn" id="modalSalvar">'+(editando?'Salvar alterações':'Adicionar item')+'</button>';
    html += '</div></div></div>';

    document.body.insertAdjacentHTML('beforeend', html);

    var fotoData = editando && item.foto ? item.foto : null;

    document.getElementById('modalCancel').addEventListener('click', closeModal);
    document.getElementById('modalOverlay').addEventListener('click', function(e){ if(e.target.id==='modalOverlay') closeModal(); });

    document.getElementById('btnAddCat').addEventListener('click', function(){
      var novaCat = document.getElementById('fNovaCategoria').value.trim();
      if(!novaCat) return;
      if(state.categorias.indexOf(novaCat)===-1){
        state.categorias.push(novaCat);
        saveCategorias();
      }
      var sel = document.getElementById('fCategoria');
      var opt = document.createElement('option');
      opt.value = novaCat; opt.textContent = novaCat; opt.selected = true;
      sel.appendChild(opt);
      document.getElementById('fNovaCategoria').value = '';
    });

    document.getElementById('fFoto').addEventListener('change', function(e){
      var file = e.target.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(ev){
        var img = new Image();
        img.onload = function(){
          var canvas = document.createElement('canvas');
          var maxW = 480;
          var scale = Math.min(1, maxW / img.width);
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          fotoData = canvas.toDataURL('image/jpeg', 0.72);
          document.getElementById('fotoPreview').innerHTML = '<img src="'+fotoData+'">';
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('modalSalvar').addEventListener('click', function(){
      var nome = document.getElementById('fNome').value.trim();
      var qtd = parseInt(document.getElementById('fQtd').value, 10);
      var errEl = document.getElementById('fErr');
      if(!nome){
        errEl.textContent = 'Informe o nome do item.';
        errEl.style.display = 'block';
        return;
      }
      if(isNaN(qtd) || qtd < 0){
        errEl.textContent = 'Informe uma quantidade válida.';
        errEl.style.display = 'block';
        return;
      }
      errEl.style.display = 'none';

      var categoria = document.getElementById('fCategoria').value;
      var status = document.getElementById('fStatus').value;
      var obs = document.getElementById('fObs').value.trim();

      if(editando){
        item.nome = nome;
        item.categoria = categoria;
        item.quantidade = qtd;
        item.status = status;
        item.observacoes = obs;
        item.foto = fotoData;
        toast('Item atualizado');
      } else {
        state.itens.push({
          id: uid(),
          nome: nome,
          categoria: categoria,
          quantidade: qtd,
          status: status,
          observacoes: obs,
          foto: fotoData,
          criadoEm: Date.now()
        });
        toast('Item adicionado ao estoque');
      }
      saveItens();
      closeModal();
      render();
    });
  }

  function openCautelaModal(){
    var disponiveis = state.itens.filter(function(i){return i.status==='disponivel' && i.quantidade>0;});
    var html = '<div class="overlay" id="modalOverlay"><div class="modal">';
    html += '<h2>Nova cautela</h2>';

    if(disponiveis.length===0){
      html += '<p style="font-size:13px;color:var(--ink-soft);">Nenhum item disponível para cautelar no momento.</p>';
      html += '<div class="modal-actions"><button class="btn secondary" id="modalCancel">Fechar</button></div></div></div>';
      document.body.insertAdjacentHTML('beforeend', html);
      document.getElementById('modalCancel').addEventListener('click', closeModal);
      document.getElementById('modalOverlay').addEventListener('click', function(e){ if(e.target.id==='modalOverlay') closeModal(); });
      return;
    }

    html += '<div class="field"><label>Responsável (retirado por)</label><input type="text" id="cResp" placeholder="Nome do militar/instrutor"></div>';
    html += '<div class="field"><label>Telefone (opcional)</label><input type="text" id="cTelefone" placeholder="(51) 9 9999-9999"></div>';
    html += '<div class="field"><label>Setor / turma (opcional)</label><input type="text" id="cSetor" placeholder="Ex: Turma 2º BIL"></div>';
    html += '<div class="field"><label>Previsão de devolução (opcional)</label><input type="date" id="cPrevisao"></div>';
    html += '<div class="field"><label>Militar estadual que entrega o material (opcional)</label>';
    html += '<input type="text" id="cEntregaNome" placeholder="Nome" style="margin-bottom:6px;">';
    html += '<input type="text" id="cEntregaGrad" placeholder="Graduação" style="margin-bottom:6px;">';
    html += '<input type="text" id="cEntregaId" placeholder="ID funcional"></div>';

    html += '<div class="field"><label>Itens a cautelar</label><div class="cautela-list">';
    disponiveis.forEach(function(item){
      html += '<div class="cautela-item-row">';
      html += '<label style="display:flex;align-items:center;gap:6px;flex:1;"><input type="checkbox" class="citem" value="'+item.id+'"> '+esc(item.nome)+' (disp: '+item.quantidade+')</label>';
      html += '<input type="number" min="1" max="'+item.quantidade+'" value="1" class="cqtd" data-for="'+item.id+'" style="width:60px;" disabled>';
      html += '</div>';
    });
    html += '</div></div>';

    html += '<div class="field"><label>Observações (opcional)</label><textarea id="cObs"></textarea></div>';
    html += '<div id="cErr" class="err" style="display:none;"></div>';

    html += '<div class="modal-actions">';
    html += '<button class="btn secondary" id="modalCancel">Cancelar</button>';
    html += '<button class="btn" id="modalCriarCautela">Criar cautela</button>';
    html += '</div></div></div>';

    document.body.insertAdjacentHTML('beforeend', html);

    document.querySelectorAll('.citem').forEach(function(cb){
      cb.addEventListener('change', function(){
        var qtdInput = document.querySelector('.cqtd[data-for="'+cb.value+'"]');
        qtdInput.disabled = !cb.checked;
      });
    });

    document.getElementById('modalCancel').addEventListener('click', closeModal);
    document.getElementById('modalOverlay').addEventListener('click', function(e){ if(e.target.id==='modalOverlay') closeModal(); });

    document.getElementById('modalCriarCautela').addEventListener('click', function(){
      var errEl = document.getElementById('cErr');
      var resp = document.getElementById('cResp').value.trim();
      var setor = document.getElementById('cSetor').value.trim();
      var previsaoRaw = document.getElementById('cPrevisao').value;
      var obs = document.getElementById('cObs').value.trim();
      var telefone = document.getElementById('cTelefone').value.trim();
      var entregaNome = document.getElementById('cEntregaNome').value.trim();
      var entregaGrad = document.getElementById('cEntregaGrad').value.trim();
      var entregaId = document.getElementById('cEntregaId').value.trim();

      var selecionados = [];
      var erro = null;
      document.querySelectorAll('.citem:checked').forEach(function(cb){
        var qtdInput = document.querySelector('.cqtd[data-for="'+cb.value+'"]');
        var qtd = parseInt(qtdInput.value, 10);
        var item = state.itens.find(function(i){return i.id===cb.value;});
        if(isNaN(qtd) || qtd < 1 || qtd > item.quantidade){
          erro = 'Quantidade inválida para "'+item.nome+'".';
        }
        selecionados.push({itemId: cb.value, quantidade: qtd});
      });

      if(!resp){
        errEl.textContent = 'Informe o responsável pela cautela.';
        errEl.style.display = 'block';
        return;
      }
      if(selecionados.length===0){
        errEl.textContent = 'Selecione ao menos um item.';
        errEl.style.display = 'block';
        return;
      }
      if(erro){
        errEl.textContent = erro;
        errEl.style.display = 'block';
        return;
      }
      errEl.style.display = 'none';

      var previsaoFmt = '';
      if(previsaoRaw){
        var partes = previsaoRaw.split('-');
        previsaoFmt = partes[2]+'/'+partes[1]+'/'+partes[0];
      }

      selecionados.forEach(function(sel){
        var item = state.itens.find(function(i){return i.id===sel.itemId;});
        if(item.quantidade === sel.quantidade){
          item.status = 'cautelado';
        } else {
          item.quantidade -= sel.quantidade;
          state.itens.push({
            id: uid(),
            nome: item.nome,
            categoria: item.categoria,
            quantidade: sel.quantidade,
            status: 'cautelado',
            observacoes: item.observacoes,
            foto: item.foto,
            criadoEm: Date.now()
          });
          sel.itemId = state.itens[state.itens.length-1].id;
        }
      });

      state.cautelas.push({
        id: uid(),
        responsavel: resp,
        telefone: telefone,
        setor: setor,
        previsao: previsaoFmt,
        observacao: obs,
        entregaNome: entregaNome,
        entregaGraduacao: entregaGrad,
        entregaIdFunc: entregaId,
        itens: selecionados,
        status: 'ativa',
        criadoEm: Date.now()
      });

      saveItens();
      saveCautelas();
      closeModal();
      state.view = 'cautelas';
      render();
      toast('Cautela criada para '+resp);
    });
  }

  (function initBrasao(){
    var img = document.getElementById('brasaoImg');
    if(!img) return;
    img.addEventListener('load', function(){ img.classList.add('show'); });
    img.addEventListener('error', function(){ img.classList.remove('show'); });
    img.src = 'brasao-cbmrs.png';
  })();

  loadAll();
})();
</script>
</body>
</html>
